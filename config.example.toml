# klams-mind config — copy to ~/.config/klams-mind/config.toml
# (or point KLAMS_MIND_CONFIG at it). Every key is optional; defaults
# target the homelab. Env overrides: KLAMS_URL, KLAMS_AGENT_NAME,
# KLAMS_EVAL_AGENT_NAME, KLAMS_MIND_MODEL_URL, KLAMS_MIND_MODEL_NAME,
# KLAMS_MIND_MODEL_API_KEY.

[klams]
base_url = "http://kubs0:7777"
# On kubs0 itself use http://localhost:7777 — the name `kubs0` resolves
# to 127.0.1.1, while klams binds 127.0.0.1 and the tailnet address.

# The identity klams-mind declares in `X-Homelab-Agent`. klams matches
# it against an `[[auth.identities]]` row and takes its scopes from
# there — the name is the whole credential, so there is nothing secret
# in this file.
agent_name = "klams-mind"

# A second, READ-scoped identity used only by `eval run`, so klams logs
# eval searches under their own `caller` and mining `search_sample` for
# new eval queries cannot feed the suite its own golden queries (#735).
# klams reads `caller` from the declared identity, not from
# register_author, so this must be a distinct name with its own
# `[[auth.identities]]` row. It is also what the report stamps.
# Empty — or equal to `agent_name` — is fine: the eval still runs, and warns.
eval_agent_name = "klams-mind-eval"

[model]
base_url = "http://kai:8000/v1" # OpenAI-compatible (kvllm)
name = "auto" # "auto" discovers the served model via /models; or a kvllm registry key
api_key = "unused" # vLLM ignores it; the OpenAI client requires one
