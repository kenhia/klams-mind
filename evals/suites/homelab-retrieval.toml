name = "homelab-retrieval"
description = """
The regression bar for klams retrieval.

Rewritten in klams sprint 026 (WI #643). The previous version had four
queries and scored 4/4 — while every failure described in klams#628 was
happening live. All four were satisfied by bulk scanner chunks, so the
suite measured "does ANN return something topical" and nothing else.

What it measures now:

  1. curated-beats-bulk  — hand-written gotchas must beat scanner chunks
                           on the phrasing an agent would actually type
  2. no_duplicates       — klams#641's invariant (44% of the corpus is
                           duplicate content; a page was 5 dup pairs)
  3. min_body_chars      — the junk ceiling: content-free fence fragments
                           score up to 0.956 and outrank real answers
  4. memory_id/max_rank  — presence is not enough; #628's complaint was
                           that the right memory EXISTED and lost
  5. identifier-heavy    — feeds the lexical-retrieval decision (#333)

Queries carry `expect`. `pass` is the regression bar. `known_open` means
"currently broken, tracked, not a regression" — the honest way to keep a
failure in the suite without leaving it permanently red. Every query here
was verified against the live corpus on 2026-07-25, not invented.

Grown in klams sprint 033 (#692): the suite had read 21/21 since 030 —
an instrument that can't fail measures nothing — so it gained what the
025–030 arc built but never guarded: supersession-under-paraphrase
(sections 8), the provenance machine-gate repair (9), and the first
harvest of real post-028 agent queries plus the standing hygiene search
as a known_open (10). All verified live 2026-07-28.
"""

# ---------------------------------------------------------------------
# 1. Baseline: things klams demonstrably contains. Carried over from the
#    original suite — still the floor, just no longer the whole bar.
# ---------------------------------------------------------------------

[[queries]]
query = "what container image does the klams service use"
top_k = 5

[[queries.checks]]
type = "source_cited"
value = "klams/deploy/docker-compose.yml"

[[queries.checks]]
type = "substring"
value = "image: klams"

[[queries.checks]]
# precision: a homelab retrieval question must not drag in cooking content.
type = "no_hallucination"
value = "sourdough"

[[queries]]
query = "what host runs the klams memory service"
top_k = 5

[[queries.checks]]
type = "substring"
value = "klams"

[[queries.checks]]
# Assert the ANSWER, not which file wins.
#
# This was `source_cited = "klams.service"` in the 2026-07-08 baseline and
# failed on the first run of the rewritten suite (2026-07-26). Investigated:
# not a regression. `deploy/systemd/klams.service` still exists but is a
# legacy path — the live units are `deploy/klams-service.service` et al —
# and sprint 024 replaced raw-score sort with RRF, which legitimately
# reordered every result. Today's top-5 (README, the planning doc, the
# deploy runbook) all answer "kubs0" correctly, which is what the question
# actually asks. Pinning a specific — and now stale — file was the bug in
# the assertion, not in retrieval.
type = "substring"
value = "kubs0"

[[queries]]
query = "where does kvllm serve models"
top_k = 5

[[queries.checks]]
type = "substring"
value = "kvllm"

[[queries.checks]]
# Same story, more starkly. This was `source_cited = "klams.example.toml"`
# — a *klams* config file that merely mentions kvllm's URL. That was the
# best answer available on 2026-07-08 because kai was not scanned until
# sprint 023, so the actual kvllm repo was not in the corpus at all.
# Today the top-5 is kvllm's own justfile, models.toml and helper.py.
# Retrieval improved; the assertion was pinning the inferior document.
# The port is the answer to "where".
type = "substring"
value = "8000"

[[queries]]
query = "klams sprint bootstrap first light"
top_k = 5

[[queries.checks]]
type = "source_cited"
value = "001-bootstrap-first-light/sprint.md"

[[queries.checks]]
type = "substring"
value = "bootstrap"

# ---------------------------------------------------------------------
# 2. klams#628 verbatim — the pair that started all of this.
#
#    Query B (literal, nearly quoting the memory) works today: the
#    gotcha ranks 0 at raw 0.785. Query A (the natural phrasing, the one
#    that actually matters) does not surface it at all — it loses to
#    multae-viae spec chunks from a DEPRECATED repo. Both go in verbatim;
#    A is the one the ranking sprint has to fix.
# ---------------------------------------------------------------------

[[queries]]
query = "klams korg tools not available ToolSearch deferred lazily loaded"
top_k = 5
# klams sprint 028: the Qwen3 swap traded this literal-phrasing rank-0
# for symptom-phrasing wins (Query A "deferred MCP tools misdiagnosis"
# now PASSES for the first time). The gotcha is retrieved at rank 1-2,
# outranked by bulk chunks — the provenance-weighting case, verbatim.
expect = "pass"
# Promoted klams sprint 030 (korg:686): the second-stage cross-encoder
# (bge-reranker-v2-m3) separates the gotcha from its sibling curated
# gotcha (019f9a36-e558) — rank 0 with the rerank stage on. History:
# known_open through 028 (bulk outranked it) and 029 (sibling shadow).

[[queries.checks]]
# #628 Query B: the target gotcha must be the top hit.
type = "memory_id"
value = "019f95dc-df08"
max_rank = 0

[[queries]]
query = "deferred MCP tools misdiagnosis"
top_k = 10
# Promoted to pass in klams sprint 028: fixed by the Qwen3 model swap —
# the #628 headline symptom-phrasing query retrieves the gotcha.

[[queries.checks]]
# #628 Query A: same memory, natural phrasing. It does not appear at all
# today; the slots go to bulk-scanned spec prose about MCP. This is THE
# curated-beats-bulk case.
type = "memory_id"
value = "019f95dc-df08"
max_rank = 2

# ---------------------------------------------------------------------
# 3. More curated-beats-bulk, in symptom phrasing — what an agent types
#    when it has the problem, not what the memory says about itself.
#    Each target is a real hand-authored memory (author `claude`).
# ---------------------------------------------------------------------

[[queries]]
# Target: 019f9d5a-25d2 — the memory_add size-ceiling gotcha.
# Symptom phrasing: what you'd type after a write mysteriously failed.
#
# Retargeted in klams sprint 028: the original target (019f9ae4-79c0,
# then its 027 successor 019f9d03-ead2) was superseded when the Qwen3
# 32k-ceiling model shipped — the suite was asserting a memory that no
# longer exists BY DESIGN. Same memory lineage, current id.
query = "memory_add failed EMBEDDING_UNAVAILABLE should I retry"
top_k = 10
# Promoted to pass in klams sprint 028 (fixed by the Qwen3 swap + the
# 028 memory supersede).

[[queries.checks]]
type = "memory_id"
value = "019f9d5a-25d2"
max_rank = 2

[[queries]]
# Same memory, phrasing closer to its own wording. Confirms the memory is
# retrievable at all — so a failure above is ranking, not absence.
# (Query text updated with the 028 retarget: no agent types "bge-small
# 512" against a 32k Qwen3 deployment.)
query = "klams memory_add size ceiling how much text PAYLOAD_TOO_LARGE split"
top_k = 10
# Promoted to pass in klams sprint 028 (retargeted to the successor
# memory, which ranks top-4 under Qwen3).

[[queries.checks]]
type = "memory_id"
value = "019f9d5a-25d2"
max_rank = 4

[[queries]]
# Target: 019f9a36-e558 — deferred vs genuinely disconnected MCP.
query = "mcp tools missing from my tool list is the server down"
top_k = 10
# Promoted to pass in klams sprint 028: fixed by the Qwen3 model swap.

[[queries.checks]]
type = "memory_id"
value = "019f9a36-e558"
max_rank = 2

[[queries]]
# Target: 019f9a83-68bc — the rpidash3 machine record.
# This one worked at rank 0 under bge-small; under Qwen3 (klams sprint
# 028) it sits at rank 1 behind another agent memory. Rank-inversion,
# not absence — the 029 weighting case.
query = "rpidash3 raspberry pi machine specs"
top_k = 5
expect = "pass"
# Promoted klams sprint 030 (korg:686): the cross-encoder ranks the
# specs record above the 'joined the fleet' note (019f9c03-8d25) —
# rank 0 with the rerank stage on. Same-tier inversion, closed by
# semantics rather than provenance.

[[queries.checks]]
type = "memory_id"
value = "019f9a83-68bc"
max_rank = 0

# ---------------------------------------------------------------------
# 4. The rpidash3 re-merge regression (korg:635).
#
#    The record was split into three because of the memory_add size
#    ceiling. Its later paragraphs (ACCESS, NETWORK) are therefore in a
#    different point than its opening — and querying THEIR terms finds
#    neither: the top hit is an unrelated obsidian note about Rust
#    videos. Gates the chunking work (#632) and the model upgrade (#655)
#    that removes the ceiling forcing the split.
# ---------------------------------------------------------------------

[[queries]]
# Promoted to `pass` on 2026-07-26 (klams sprint 029): fixed by the
# curated-stratum fusion source — the split record's parts are agent
# memories, and the stratum surfaces them (raw 0.64 vs a 0.57 global
# top) even though no global top-k ever contained them. The record is
# still split (korg:635 / klams#632); consolidation via the new
# memory_supersede is the remaining data action.
query = "rpidash3 tailscale ed25519 passwordless sudo cloud-init groups"
top_k = 10

[[queries.checks]]
type = "memory_id"
value = "019f9a83"
max_rank = 4

[[queries.checks]]
# The failure is loud: an obsidian Rust-course note wins a homelab
# machine query outright.
type = "no_hallucination"
value = "Duke Courses"

# ---------------------------------------------------------------------
# 5. The dedupe invariant (klams#641).
#
#    Verified live on 2026-07-25 against klams v0.1.25 (pre-fix): this
#    query returned the same kpidash doc from kai AND kubs0 at ranks 1-2,
#    and the same README from both hosts at ranks 3-4. Two duplicate
#    pairs in a six-result page. These must pass once 026 deploys.
# ---------------------------------------------------------------------

[[queries]]
query = "rpidash3 dashboard raspberry pi"
top_k = 10

[[queries.checks]]
type = "no_duplicates"

[[queries]]
query = "kpidash dashboard build commands"
top_k = 10

[[queries.checks]]
type = "no_duplicates"

[[queries]]
query = "kpidash cross compilation aarch64 toolchain"
top_k = 10

[[queries.checks]]
type = "no_duplicates"

# ---------------------------------------------------------------------
# 6. The junk ceiling (klams F-2.3).
#
#    `kpidash Development Guidelines > Commands > Dashboard build` +
#    "```bash" is a real, live chunk (019f509b-2f45). Breadcrumb
#    stripped, its body is seven characters — and it ranks, because it is
#    almost exactly the query's words and nothing else. The chunker is
#    fence-unaware: a `# comment` inside a bash block parses as a heading
#    and closes the section right after the opening fence.
# ---------------------------------------------------------------------

[[queries]]
# Promoted to `pass` on 2026-07-26 (klams sprint 029 session): the 028
# baseline run reported it newly fixed — the fence-aware chunker (#639,
# shipped in 028 despite this comment's "not yet scheduled") plus the
# corpus rebuild removed the 7-character '```bash' fragments from this
# page. Junk reappearing here is a genuine regression.
query = "kpidash dashboard build commands"
top_k = 5

[[queries.checks]]
type = "min_body_chars"
min_chars = 40
top_n = 5

[[queries]]
# Promoted to `pass` on 2026-07-26: this one came back clean on the first
# real run. The fence-unaware chunker is NOT fixed — the kpidash query
# above still catches a 7-character '```bash' fragment — but this query's
# top-5 is junk-free today, so holding it as a regression bar is worth
# more than leaving it open. Junk reappearing here is a genuine
# regression.
query = "klams gate fmt clippy test"
top_k = 5

[[queries.checks]]
type = "min_body_chars"
min_chars = 40
top_n = 5

# ---------------------------------------------------------------------
# 7. Identifier-heavy set — feeds the lexical-retrieval decision (#333).
#
#    Knowledge is ANN-only; there is no lexical signal for knowledge at
#    all. These are exact tokens with known homes. If they land, pure
#    vector retrieval is adequate for identifiers and #333 can be
#    declined; if they don't, that is the evidence for adding BM25.
#    Recorded as measurements, not as a pass/fail bar — which way they
#    fall IS the decision input.
# ---------------------------------------------------------------------

[[queries]]
query = "EMBEDDING_UNAVAILABLE"
top_k = 10

[[queries.checks]]
type = "substring"
value = "EMBEDDING_UNAVAILABLE"

[[queries]]
query = "LOW_SCORE_THRESHOLD"
top_k = 10
# Promoted to pass in klams sprint 028: Qwen3 retrieves the exact
# identifier — weakens the #333 lexical-gap case; keep watching.

[[queries.checks]]
type = "substring"
value = "LOW_SCORE_THRESHOLD"

[[queries]]
query = "encke-wahoo.ts.net tailnet hostname"
top_k = 10

[[queries.checks]]
type = "substring"
value = "encke-wahoo"

[[queries]]
# Promoted to `pass` on 2026-07-26 — and the contrast with
# LOW_SCORE_THRESHOLD above is the actual #333 finding.
#
# Both are exact identifiers living in klams' own scanned source. This one
# retrieves; LOW_SCORE_THRESHOLD does not. The difference is occurrence
# count and surrounding prose: `find_knowledge_by_content_hash` appears in
# many chunks with descriptive text around it, so the embedding has
# something to match. `LOW_SCORE_THRESHOLD` appears in a couple of dense
# code chunks and vanishes. So the lexical gap is not "identifiers never
# work" — it is "identifiers work only when they are already well
# represented in prose", which is exactly the wrong property for
# looking up a rare symbol. Keep BOTH: this one as the regression bar,
# that one as the open evidence.
query = "find_knowledge_by_content_hash"
top_k = 10

[[queries.checks]]
type = "substring"
value = "find_knowledge_by_content_hash"

[[queries]]
query = "klams listen_addr config key"
top_k = 10

[[queries.checks]]
type = "substring"
value = "listen_addr"

# ---------------------------------------------------------------------
# 8. Lifecycle adversarial cases (added klams sprint 033, #692).
#
#    029 shipped supersede/update/volatility and 030 the reranker; the
#    suite had no case that could fail if that machinery broke. These
#    exercise it against real lifecycle chains in the live corpus.
# ---------------------------------------------------------------------

[[queries]]
# Supersession must hold under PARAPHRASE, not just the original
# wording: the 0.1.28 → 0.1.29 → 0.1.30 search-behavior memory chain
# is real (each note superseded its predecessor via memory_supersede).
# The current note must win; the superseded 0.1.29 note must stay
# hidden — a superseded record resurfacing at any rank is the exact
# failure supersession exists to prevent (review F-1.1: "a superseded
# memory surfacing at rank 7 still gets believed").
query = "klams memory_search score field behavior ranking"
top_k = 8
# klams-mind #2247 (sprint 009): the pinned head of that chain,
# `019fa04a-ceac`, is itself now superseded — by `019fbc9c-5c74`, the
# same subject re-measured at klams 0.1.41 (korg #634) — and is absent
# from the corpus at top_k 50. The `no_hallucination` half below still
# holds, so what rotted is the id pin, not the invariant. Re-pinning
# changes what this query measures, so it waits on a ruling rather
# than being quietly repointed.
expect = "known_open"
tracking = "korg:2247"

[[queries.checks]]
type = "memory_id"
value = "019fa04a-ceac"
max_rank = 0

[[queries.checks]]
# The superseded note's own phrasing; only it contains this string.
type = "no_hallucination"
value = "as of 0.1.29"

# ---------------------------------------------------------------------
# 9. Provenance-integrity repair bar (added klams sprint 033, #692).
#
#    The curated classifier's machine-gate (029) was added to keep
#    scanned transcript chunks out of the curated stratum. #688 (032)
#    re-sourced those chunks to Task — after which the gate's ONLY
#    remaining effect was collateral: 10 genuine May–July agent writes
#    carrying a legacy `machine` stamp were silently down-tiered to
#    Bulk. Sprint 033 repaired the 10 points (cleared `machine`;
#    before-state in klams sprints/033-retrospective/). Measured
#    pre-repair: the axum gotcha LOST rank 0 to a lower-raw scanner
#    chunk (0.708 vs 0.651). These two hold the repair: a regression
#    here means machine-stamped agent writes are back, or the gate
#    grew new collateral.
# ---------------------------------------------------------------------

[[queries]]
query = "axum middleware layer nested router auth not applied"
top_k = 5

[[queries.checks]]
type = "memory_id"
value = "019e6043-5582"
max_rank = 0

[[queries]]
query = "rmcp allowed_hosts 403 forbidden host header"
top_k = 5

[[queries.checks]]
type = "memory_id"
value = "019e6043-5585"
max_rank = 0

# ---------------------------------------------------------------------
# 10. Mined from real post-028 traffic (added klams sprint 033, #692).
#
#     First harvest of the search_sample log the 026 review asked for.
#     Caveat learned doing it: ~75% of the log is the eval suite's own
#     runs (caller klams-mind), so mining it naively feeds the suite
#     its own queries back — these came from the organic remainder
#     (caller claude, 2026-07-27/28), verified live before adding.
# ---------------------------------------------------------------------

[[queries]]
# An agent locating the agent-skills deploy story. The curated
# consolidation note must beat the bulk chunks of the skills repo
# itself.
query = "agent-skills repo kubs0 kai claude hooks deploy install.sh"
top_k = 5

[[queries.checks]]
type = "memory_id"
value = "019fa694-6664"
max_rank = 2

[[queries]]
# Session-title plumbing: the hand-authored note on where the
# auto-generated title lives must beat the scanned transcripts that
# merely mention it.
query = "Claude Code session title aiTitle customTitle transcript auto-generated name"
top_k = 5

[[queries.checks]]
type = "memory_id"
value = "019fa100-bd42"
max_rank = 1

[[queries]]
# The standing post-sprint hygiene search, verbatim (run after every
# klams sprint). Promoted to `pass` in klams sprint 037 (#729/#333):
# the lexical candidate list (Qdrant full-text index, 5th RRF source)
# surfaces the flagship gotcha for this phrasing — its cosine (raw
# 0.405, under the 0.45 stratum floor; measured 2026-07-28) never
# could, but "gotcha" is literally in the text, and the all-tokens
# match now argues for it. History: known_open from 033 to 036.
query = "klams gotcha"
top_k = 5
expect = "pass"

[[queries.checks]]
type = "memory_id"
value = "019f95dc-df08"
max_rank = 4
